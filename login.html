<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | WebMaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#0e4a5a"/>
        <path d="M11 20 L21.5 46 L32 27 L42.5 46 L53 20" fill="none" stroke="#f2a93b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>WebMaker</span>
    </div>

    <h1>Welcome</h1>
    <p class="muted">Sign in or create an account to continue.</p>

    <button type="button" class="google-btn" id="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <p class="divider">or use email</p>

    <form id="auth-form" class="form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password (at least 6 characters)</label>
        <div class="pw-wrap">
          <input type="password" id="password" required minlength="6" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pw-toggle">Show</button>
        </div>
      </div>

      <div class="pw-tools">
        <button type="button" class="link-btn" id="suggest-btn">Suggest a strong password</button>
        <span id="pw-hint" class="hint">Or type your own. Tip: 12+ characters with letters, numbers and symbols.</span>
      </div>

      <button type="submit" class="btn">Sign in</button>
      <button type="button" class="btn ghost" id="signup-btn">Create account</button>
      <p id="auth-status" role="status"></p>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
